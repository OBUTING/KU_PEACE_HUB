<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Gallery | PEACE HUB</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/public-lists.css" />
</head>
<body>
  <!-- Reuse your existing navbar include/partial here -->

  <main class="list-page">
    <h1>Gallery — Admin</h1>
    <p class="list-page-intro">Upload and remove photos shown on the public gallery page.</p>

    <div class="admin-key-bar">
      <input type="password" id="admin-key-input" placeholder="Admin key" />
      <button class="entry-primary-btn" id="save-key-btn">Use key</button>
    </div>

    <form id="upload-form" class="photo-upload-form">
      <label for="file-input">Photo (max 5MB)</label>
      <input type="file" id="file-input" accept="image/*" required />

      <label for="caption-input">Caption (optional)</label>
      <input type="text" id="caption-input" placeholder="e.g. Peace Walk, July 2026" />

      <button type="submit" class="entry-primary-btn" id="upload-btn">Upload photo</button>
      <span id="upload-status"></span>
    </form>

    <div id="gallery-status" class="list-loading">Loading photos…</div>
    <div id="photo-grid" class="photo-grid"></div>
  </main>

  <script src="/js/admin-gallery.js"></script>
</body>
</html>
